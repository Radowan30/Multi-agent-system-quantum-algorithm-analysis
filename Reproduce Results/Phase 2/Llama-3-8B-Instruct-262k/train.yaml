# ==============================================================================
# Phase 2 (Gradient variant) — Fine-tune Llama-3-8B-Instruct-262k with
# lora_alpha = 32, cutoff_len = 4000.
#
# Mirrors Phase 2 alpha32 (LLaMA 3.1) exactly. Only differences:
#   - model_name_or_path: Llama-3-8B-Instruct-262k (262K context, continued-
#     pretrained from Meta-Llama-3-8B-Instruct, same family as Phase 1 base)
#   - output_dir under saves/Llama-3-8B-Instruct-262k/
#
# Run: cd LLaMA-Factory && \
#   llamafactory-cli train "../Fine-tuned Gradient 262k 8B/train_gradient_alpha32.yaml"
# ==============================================================================

### model
model_name_or_path: /home/quantum-user/radowan/models/Llama-3-8B-Instruct-262k
trust_remote_code: true
resize_vocab: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 32
lora_dropout: 0.0
lora_target: q_proj,v_proj
additional_target: embed_tokens,lm_head
disable_shuffling: true

### dataset
dataset: Grover_FullCircuit_2_7_MMS,Grover_Oracle_2_10_MMS
dataset_dir: /home/quantum-user/radowan/final_year_project/LLaMA-Factory/data
template: llama3
cutoff_len: 4000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: /home/quantum-user/radowan/final_year_project/saves/Llama-3-8B-Instruct-262k/lora/Gradient262k_alpha32
logging_steps: 10
save_steps: 50
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
num_train_epochs: 10.0
lr_scheduler_type: cosine
warmup_steps: 20
weight_decay: 0.0
max_grad_norm: 1.0
optim: adamw_torch_fused
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1.0e-8
fp16: true
seed: 42
dataloader_num_workers: 4
ddp_timeout: 180000000

### eval
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50
load_best_model_at_end: true
metric_for_best_model: loss
greater_is_better: false
