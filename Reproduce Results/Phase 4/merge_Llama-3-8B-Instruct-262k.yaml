# ==============================================================================
# Phase 4 — Merge LoRA adapter (q_proj/v_proj LoRA + the full trained
# embed_tokens/lm_head from modules_to_save) into a single standalone model
# for vLLM eval.
#
# Run AFTER training finishes:
#   cd $WORK/LLaMA-Factory && \
#     llamafactory-cli export "<repo>/Reproduce Results/Phase 4/merge_Llama-3-8B-Instruct-262k.yaml"
# ==============================================================================

### model
model_name_or_path: ../models/Llama-3-8B-Instruct-262k-quantum   # prepared by tokenizer/prepare_quantum_model.py
adapter_name_or_path: ../saves/Llama-3-8B-Instruct-262k/lora/Phase4_alpha32
template: llama3
finetuning_type: lora
trust_remote_code: true
resize_vocab: true                        # resize base embeddings (128256) to extended 128395
                                          # BEFORE applying the adapter, so the adapter's
                                          # 128395-row embed_tokens/lm_head load without
                                          # a size mismatch.

### export
export_dir: ../saves/Llama-3-8B-Instruct-262k/merged/Phase4_alpha32
export_size: 5                # shard size in GB (eval handles sharded output)
export_device: cpu            # merge on CPU — pure weight arithmetic, avoids GPU pressure
export_legacy_format: false   # safetensors (required by vLLM)
